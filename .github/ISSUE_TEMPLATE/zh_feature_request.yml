name: CN | 功能建议
description: 想要一个新功能或给 TintedPaper 提建议？
type: "Feature"

body:
  - type: markdown
    attributes:
      value: |
        请描述您希望 TintedPaper 提供的具体功能或优化。

  - type: textarea
    attributes:
      label: 你想加入什么功能？
      description: 用几句话尽可能清晰，详细的描述你所需要的功能或者建议。
    validations:
      required: true
