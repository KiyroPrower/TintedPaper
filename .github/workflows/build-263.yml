name: Build TintedPaper 26.3

on:
  push:
    branches: ["ver/26.3"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout TintedPaper
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
      - name: Configure Git
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "GitHub Actions"
          chmod +x gradlew
      - name: Apply patches
        run: ./gradlew applyAllPatches --stacktrace --no-daemon
      - name: Test and package TintedPaper
        run: ./gradlew :leaf-server:test createLeafclipJar --stacktrace --no-daemon
      - name: Prepare TintedPaper artifact
        run: |
          mkdir -p dist
          cp leaf-server/build/libs/leaf-leafclip-26.3*.jar dist/tintedpaper-26.3.jar
      - name: Upload TintedPaper
        uses: actions/upload-artifact@v7
        with:
          name: tintedpaper-26.3
          path: dist/tintedpaper-26.3.jar
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tintedpaper-test-reports
          path: leaf-server/build/reports/tests/test/
