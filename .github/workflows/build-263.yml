name: TintedPaper CI and releases

on:
  pull_request:
    branches: ["ver/26.3"]
  push:
    branches: ["ver/26.3"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tintedpaper-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUILD_NUMBER: ${{ github.run_number }}
  BUILD_BRANCH: ${{ github.base_ref || github.ref_name }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TintedPaper
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
      - name: Configure Git
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "GitHub Actions"
          chmod +x gradlew
      - name: Apply patches
        run: ./gradlew applyAllPatches --stacktrace --no-daemon
      - name: Test and package TintedPaper
        run: ./gradlew :tintedpaper-server:test createTintedPaperJar --stacktrace --no-daemon
      - name: Verify distribution metadata
        run: python3 scripts/check-distribution.py
      - name: Prepare release assets
        run: bash scripts/prepareRelease.sh
      - name: Upload TintedPaper
        uses: actions/upload-artifact@v7
        with:
          name: tintedpaper-build-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tintedpaper-tests-${{ github.run_number }}
          path: tintedpaper-server/build/reports/tests/test/

  release:
    name: Publish prerelease
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/ver/26.3' && github.repository == 'KiyroPrower/TintedPaper'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated assets
        uses: actions/download-artifact@v8
        with:
          name: tintedpaper-build-${{ github.run_number }}
          path: dist
      - name: Publish numbered ALPHA build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "26.3-build.${BUILD_NUMBER}" dist/*.jar dist/*.sha256 \
            --target "$GITHUB_SHA" \
            --title "TintedPaper 26.3 build ${BUILD_NUMBER} (ALPHA)" \
            --notes-file dist/release-notes.md \
            --prerelease
